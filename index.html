<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StayWellAndWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg: #E8DFC8;
    --card-bg: #F0EFEA;
    --ink: #171512;
    --ink-soft: rgba(23,21,18,0.62);
    --ink-faint: rgba(23,21,18,0.42);
    --hairline: rgba(23,21,18,0.10);
    --hairline-top: rgba(255,255,255,0.65);
    --accent: #50C878;
    --accent-ink: #FFFFFF;
    --shadow: 0 1px 0 var(--hairline-top) inset, 0 1px 2px rgba(23,21,18,0.05), 0 16px 32px -18px rgba(23,21,18,0.22);
    --display: "Sora", ui-sans-serif, system-ui, sans-serif;
    --body: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page-bg);
    color: var(--ink);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .cover {
    height: 108px;
    background:
      radial-gradient(140% 180% at 18% -20%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
      linear-gradient(180deg, color-mix(in srgb, var(--ink) 8%, var(--page-bg)) 0%, var(--page-bg) 100%);
    border-bottom: 1px solid rgba(23,21,18,0.06);
  }
  .stage { display: flex; justify-content: center; padding: 0 20px 72px; margin-top: -46px; }
  .col { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--card-bg);
    border-radius: 18px;
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow);
  }
  .avatar-row { display: flex; justify-content: center; }
  .avatar {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: linear-gradient(160deg, #ffffff, #f1ece0);
    border: 3px solid var(--card-bg);
    box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 10px 22px -10px rgba(23,21,18,0.35);
    display: grid; place-items: center;
    position: relative;
    overflow: hidden;
  }
  .avatar-img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-mark {
    font-family: var(--display); font-weight: 800;
    font-size: 1.5rem; letter-spacing: -0.02em; color: var(--accent);
  }
  .avatar-ring { position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--accent) 35%, transparent); }
  .masthead { padding: 16px 24px 26px; text-align: center; margin-top: 14px; }
  h1 {
    font-family: var(--display); font-weight: 800;
    font-size: 1.5rem; line-height: 1.16; letter-spacing: -0.01em;
    text-wrap: balance; margin: 0 0 10px; color: var(--ink);
  }
  .tagline { font-size: 0.86rem; line-height: 1.5; color: var(--ink-soft); max-width: 32ch; margin: 0 auto; }
  .dispatch {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 20px 22px; text-decoration: none; color: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .dispatch:hover {
    transform: translateY(-2px);
    box-shadow: 0 1px 0 var(--hairline-top) inset, 0 2px 4px rgba(23,21,18,0.06), 0 22px 38px -18px rgba(23,21,18,0.26);
  }
  .topic-icon {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--ink) 6%, var(--card-bg));
    border: 1px solid var(--hairline);
    font-size: 18px; line-height: 1;
  }
  .dispatch-text { min-width: 0; flex: 1; display: flex; flex-direction: column; }
  .headline {
    font-family: var(--display); font-weight: 700; font-size: 1rem;
    line-height: 1.32; letter-spacing: -0.005em; color: var(--ink);
  }
  .beat { font-size: 0.78rem; color: var(--ink-soft); margin-top: 6px; line-height: 1.4; }
  .arrow {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 11%, transparent);
    color: var(--accent); font-size: 14px;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .dispatch:hover .arrow { transform: translateX(2px); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .empty { padding: 20px 22px; opacity: 0.6; font-size: 0.9rem; text-align: center; }
  .capture { padding: 26px 24px 28px; text-align: center; }
  .capture-head { font-family: var(--display); font-weight: 700; font-size: 1rem; margin: 0 0 4px; color: var(--ink); }
  .capture-sub { font-size: 0.8rem; color: var(--ink-soft); margin: 0 0 18px; }
  .capture-row { display: flex; gap: 8px; }
  .email-input {
    flex: 1; min-width: 0; padding: 13px 15px; border-radius: 12px;
    border: 1px solid var(--hairline); background: color-mix(in srgb, var(--ink) 4%, var(--page-bg));
    color: var(--ink); font-family: var(--body); font-size: 0.92rem;
  }
  .email-input::placeholder { color: var(--ink-faint); }
  .email-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .email-submit {
    font-family: var(--display); font-weight: 700; font-size: 0.86rem; padding: 0 20px;
    border-radius: 12px; border: none; background: var(--accent); color: var(--accent-ink);
    cursor: pointer; white-space: nowrap; transition: transform 0.12s ease, filter 0.15s ease;
  }
  .email-submit:hover { filter: brightness(0.92); transform: translateY(-1px); }
  .email-submit:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* Honeypot field: hidden from real visitors, still present in the DOM for bots to fill in */
  .hp-field { position: absolute; left: -9999px; top: -9999px; }
  footer { padding: 10px 6px 0; display: flex; align-items: center; justify-content: space-between; }
  .foot-label { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="cover"></div>
<div class="stage">
  <main class="col" aria-label="StayWellAndWise link in bio">

    <div class="avatar-row">
      <div class="avatar">
        <div class="avatar-ring"></div>
        <span class="avatar-mark">SW</span>
      </div>
    </div>

    <div class="card masthead">
      <h1>StayWellAndWise</h1>
      <p class="tagline">Most content makes you feel something. StayWellAndWise makes you do something.</p>
    </div>

    <div class="col" style="gap:14px;">
      <p class="empty">More coming soon.</p>
    </div>

    <div class="card capture">
      <p class="capture-head">Stay in the loop</p>
      <p class="capture-sub">Get new drops and updates straight to your inbox.</p>
      <form name="email-signup" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="capture-row">
        <input type="hidden" name="form-name" value="email-signup" />
        <p class="hp-field">
          <label>Don't fill this out if you're human: <input name="bot-field" /></label>
        </p>
        <input class="email-input" type="email" name="email" placeholder="you@example.com" required aria-label="Email address">
        <button class="email-submit" type="submit">Subscribe</button>
      </form>
    </div>

    <footer>
      <span class="foot-label">StayWellAndWise</span>
    </footer>

  </main>
</div>
</body>
</html>
