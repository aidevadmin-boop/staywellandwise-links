<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StayWellAndWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --primary: #FFFFFF;
    --accent: #50C878;
    --card-bg: #F0EFEA;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: var(--bg); color: var(--primary);
    font-family: "Plus Jakarta Sans", sans-serif;
  }
  .wrap {
    max-width: 480px; margin: 0 auto;
    padding: 48px 20px 64px;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 {
    font-family: "Sora", sans-serif;
    font-size: 1.6rem; font-weight: 700;
    margin: 0 0 8px; text-align: center;
  }
  .tagline {
    font-size: 0.9rem; opacity: 0.75; text-align: center;
    margin: 0 0 32px; max-width: 360px; line-height: 1.4;
  }
  .cards { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: flex; flex-direction: column; gap: 4px;
    background: var(--card-bg); color: #111;
    border-radius: 16px; padding: 16px 18px;
    text-decoration: none; border: 1px solid rgba(0,0,0,0.06);
    transition: transform 0.15s ease;
  }
  .card:hover { transform: translateY(-2px); }
  .card-name {
    font-family: "Sora", sans-serif;
    font-weight: 600; font-size: 1rem;
  }
  .card-desc { font-size: 0.85rem; opacity: 0.75; }
  .card::after {
    content: "→"; align-self: flex-end; color: var(--accent);
    font-weight: 600; margin-top: -20px;
  }
  .empty { opacity: 0.6; font-size: 0.9rem; text-align: center; }
  footer {
    margin-top: 40px; font-size: 0.75rem; opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>StayWellAndWise</h1>
    <p class="tagline">Most content makes you feel something. StayWellAndWise makes you do something.</p>
    <div class="cards">
      <p class="empty">More coming soon.</p>
    </div>
    <footer>StayWellAndWise</footer>
  </div>
</body>
</html>
