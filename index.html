<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StayWellAndWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --primary: #FFFFFF;
    --accent: #50C878;
    --card-bg: #F0EFEA;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: var(--bg); color: var(--primary);
    font-family: "Plus Jakarta Sans", sans-serif;
  }
  .wrap {
    max-width: 480px; margin: 0 auto;
    padding: 48px 20px 64px;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 {
    font-family: "Sora", sans-serif;
    font-size: 1.6rem; font-weight: 700;
    margin: 0 0 8px; text-align: center;
  }
  .tagline {
    font-size: 0.9rem; opacity: 0.75; text-align: center;
    margin: 0 0 32px; max-width: 360px; line-height: 1.4;
  }
  .cards { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: flex; flex-direction: column; gap: 4px;
    background: var(--card-bg); color: #111;
    border-radius: 16px; padding: 16px 18px;
    text-decoration: none; border: 1px solid rgba(0,0,0,0.06);
    transition: transform 0.15s ease;
  }
  .card:hover { transform: translateY(-2px); }
  .card-name {
    font-family: "Sora", sans-serif;
    font-weight: 600; font-size: 1rem;
  }
  .card-desc { font-size: 0.85rem; opacity: 0.75; }
  .card::after {
    content: "→"; align-self: flex-end; color: var(--accent);
    font-weight: 600; margin-top: -20px;
  }
  .empty { opacity: 0.6; font-size: 0.9rem; text-align: center; }
  .email-section {
    width: 100%; margin-top: 36px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .email-heading {
    font-family: "Sora", sans-serif;
    font-weight: 600; font-size: 1rem; margin: 0; text-align: center;
  }
  .email-subtext {
    font-size: 0.8rem; opacity: 0.7; text-align: center; margin: -6px 0 4px; max-width: 340px;
  }
  .email-form { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .email-input {
    width: 100%; padding: 14px 16px; border-radius: 14px;
    border: 1px solid rgba(0,0,0,0.08);
    background: var(--card-bg); color: #111;
    font-family: "Plus Jakarta Sans", sans-serif; font-size: 0.95rem;
  }
  .email-input::placeholder { color: rgba(17,17,17,0.5); }
  .email-submit {
    width: 100%; padding: 14px 16px; border-radius: 14px; border: none;
    background: var(--accent); color: #111;
    font-family: "Sora", sans-serif; font-weight: 600; font-size: 0.95rem;
    cursor: pointer;
  }
  /* Honeypot field: hidden from real visitors, still present in the DOM for bots to fill in */
  .hp-field { position: absolute; left: -9999px; top: -9999px; }
  footer {
    margin-top: 40px; font-size: 0.75rem; opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>StayWellAndWise</h1>
    <p class="tagline">Most content makes you feel something. StayWellAndWise makes you do something.</p>
    <div class="cards">
      <p class="empty">More coming soon.</p>
    </div>
    <div class="email-section">
      <p class="email-heading">Stay in the loop</p>
      <p class="email-subtext">Get new drops and updates straight to your inbox.</p>
      <form name="email-signup" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="email-form">
        <input type="hidden" name="form-name" value="email-signup" />
        <p class="hp-field">
          <label>Don't fill this out if you're human: <input name="bot-field" /></label>
        </p>
        <input class="email-input" type="email" name="email" placeholder="you@example.com"
               required aria-label="Email address">
        <button class="email-submit" type="submit">Subscribe</button>
      </form>
    </div>
    <footer>StayWellAndWise</footer>
  </div>
</body>
</html>
